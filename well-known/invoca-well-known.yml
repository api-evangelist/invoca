notes: >-
  Invoca publishes NO /.well-known/ discovery document on any of its hosts. Every canonical
  path was probed on the marketing host, the API host, the developer portal, the Bulk
  Ringpool host and the trust host, and none returned a real document.

  IMPORTANT — trust.invoca.com is a SPA catch-all. It answers HTTP 200 with the same
  `<!doctype html>` application shell for EVERY /.well-known/* path, including paths that
  cannot exist. Those 200s are recorded below as false positives and are NOT counted as
  hits. No `type: WellKnown` and no `type: SecurityTxt` pointer is wired in apis.yml, because
  a pointer would assert that Invoca serves a discovery surface it does not serve.

  Invoca DOES publish an llms.txt at https://www.invoca.com/llms.txt (HTTP 200, saved
  verbatim at llms/invoca-llms.txt), but that is a root-path document, not a /.well-known
  one, and is pointed at by the LLMsTxt type instead.
