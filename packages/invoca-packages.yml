method: searched
source: >-
  Registry searches against npm (registry.npmjs.org), PyPI, RubyGems and the Invoca GitHub
  organization (github.com/Invoca, 180 public repositories), plus the Invoca developer portal
  SDK/credential pages.
finding: >-
  Invoca publishes NO first-party client library for the Invoca API in any registry. There is
  no invoca package on PyPI (404), no Invoca-authored package on npm (the `invoca`,
  `@invoca/*` names on npm are an unrelated 2020 "2D Point" placeholder published by an
  outside user, NOT Invoca), and no API-client gem on RubyGems. The Invoca GitHub org is
  large and active, but every public gem it ships is internal Ruby/Rails infrastructure
  tooling — logging, metrics, schema declaration, process settings — not a wrapper around
  the Invoca API. Integration is expected to be direct HTTPS against the date-versioned REST
  endpoints, or through the no-code platform integrations.
