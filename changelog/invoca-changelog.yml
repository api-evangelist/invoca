notes: >-
  Invoca publishes a product release feed on its marketing site, grouped by month and
  categorised by product area (SMS Agent, Signal AI, Integrations, General, Dashboards,
  Transcripts, Voice Agent, QM, Scorecards, Google). Entries are feature announcements — they
  carry no version numbers, no API version bindings and no breaking-change markers. The
  date-versioned API surface itself is tracked separately in
  lifecycle/invoca-lifecycle.yml; the developer portal
  (developers.invoca.net) publishes NO changelog or release-notes page of its own
  (/changelog.html and /release_notes.html both 404), so an API consumer has no
  developer-facing record of what changed between date versions.
