finding: >-
  Invoca publishes no rate limits. Every page of the developer portal was read for a rate,
  quota, throttling or 429 statement and none exists: the design-principles page, the error
  handling page, the API-credential guidelines, and each API reference (Transactions, Signal,
  Call, Call Ingestion, Calls In Progress, Network Integration, Bulk Ringpool, legacy
  Ringpool) document status codes but no limit and no rate-limit response headers. The
  harvested SMS Messaging OpenAPI declares no 429 response on any of its 12 operations.
  The Invoca Support knowledge base (support.invoca.com, community.invoca.com) is
  authentication-gated (HTTP 401), so a limit published only to customers would not be
  visible here.
headers:
  documented: []
  observed: []
  note: >-
    No X-RateLimit-*, RateLimit-* or Retry-After header is documented anywhere in the public
    developer portal, and none could be observed because every Invoca API endpoint requires a
    credential.
