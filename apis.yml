aid: invoca
name: Invoca
description: >-
  Invoca is an AI-powered revenue execution platform that connects marketing and
  sales teams by tracking and analyzing inbound phone calls across the buying
  journey. Its call tracking, conversation intelligence, and signal analytics
  attribute phone conversations back to the paid media, campaigns, and digital
  touchpoints that drove them, so revenue teams can optimize ad spend and improve
  buyer experiences. For developers, Invoca publishes a REST developer platform
  (developers.invoca.net) with date-versioned APIs covering call transactions,
  signals, call ingestion, RingPool number allocation, network integration, and
  pre-call insight, authenticated with self-serve Invoca API tokens or HTTP Basic.
