watch:
  finding: >-
    Invoca is standing up a Mintlify-powered documentation site — the public repository
    github.com/Invoca/docs describes itself as the "Mintlify-powered documentation site for
    Invoca's Support and Developer Portal" (last pushed 2026-06-01) and its docs.json
    enables Mintlify's `contextual` options including "mcp". Mintlify auto-provisions an MCP
    endpoint and an llms.txt for a published site, so this is the most likely origin of a
    first real Invoca MCP server.
  status: not-live
  evidence:
