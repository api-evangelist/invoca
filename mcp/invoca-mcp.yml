tools:
- name: list_call_transactions
  description: Read call transaction / attribution data (Transactions API).
  source: https://developers.invoca.net/en/latest/api_documentation/transactions_api/index.html
  rest: 'GET https://invoca.net/api/2018-02-01/transactions.json'
- name: report_signal
  description: Apply Signals and/or Custom Data Fields to a specific call after it has occurred (Signal API).
  source: https://developers.invoca.net/en/latest/api_documentation/signal_api/index.html
- name: ingest_call
  description: Ingest an externally originated call for Invoca intelligence processing (Call Ingestion API).
  source: https://developers.invoca.net/en/latest/api_documentation/call_ingestion_api/index.html
  rest: 'POST https://invoca.net/api/2022-03-01/calls.json'
- name: get_call_transcript
  description: Retrieve transcript and transcript analysis for a call (Call API).
  source: https://developers.invoca.net/en/latest/api_documentation/call_api/index.html
- name: allocate_ringpool_number
  description: Allocate a dynamic, trackable promo phone number from a RingPool (Bulk Ringpool API).
  source: https://developers.invoca.net/en/latest/api_documentation/bulk_ringpool_api.html
  rest: 'POST https://pnapi.invoca.net/api/2013-07-01/bulk.json'
- name: sync_network_data
  description: >-
    Replicate advertiser, publisher, campaign, RingPool and promo-number data with partner
    platforms (Network Integration).
  source: https://developers.invoca.net/en/latest/api_documentation/network_integration/index.html
- name: get_calls_in_progress
  description: Retrieve pre-call PreSense insight for live / in-progress calls (Calls In Progress API).
  source: https://developers.invoca.net/en/latest/api_documentation/calls_in_progress_api/index.html
  rest: 'GET https://invoca.net/api/2022-08-01/calls_in_progress/current_calls.json'
- name: send_sms_message
  description: Send an SMS message and read message / delivery-report state (SMS Messaging API).
  source: openapi/invoca-sms-messaging-openapi.json
  rest: 'POST /messages'
  note: >-
    The only candidate tool backed by a machine-readable schema — the harvested SMS Messaging
    OpenAPI supplies a real request body (components/schemas/MessageRequest) and real
    response shapes. Every other tool above would need its input schema written by hand from
    prose.
